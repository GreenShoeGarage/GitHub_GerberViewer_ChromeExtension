name: CI

# Run on every push to the default branch and on every pull request, so a
# regression in the smoke suite or an unbudgeted bundle increase is caught
# before it lands.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the content script bundle
        run: node build.mjs

      - name: Run the smoke test suite
        run: node test/smoke.mjs

      - name: Check bundle size budget
        run: node scripts/check-bundle-size.mjs
